const L=k=>{if(k in M)return M[k];try{const v=localStorage.getItem("eb_"+k);if(v!==null)return M[k]=JSON.parse(v)}catch(e){}return M[k]=null};

const D=[
["Mathematics","Sets","What is a set in mathematics?|set sets element subset union intersection","A set is a collection of distinct things.","A set is a well-defined collection of distinct objects, written in braces: A = {1, 2, 3}. We write 2 ∈ A to say 2 belongs to A. B is a subset of A if every element of B is in A. Union (∪) combines two sets; intersection (∩) keeps only shared elements.","A set is a group of things, like a bag of fruit: {apple, mango}. Each thing in it is an element.","A = {1,2,3}, B = {2,3,4}. A ∪ B = {1,2,3,4} and A ∩ B = {2,3}.","Order does not matter|Repeated items count once","Counting and grouping objects."],
["Mathematics","Matrices","What is a matrix?|matrix matrices rows columns order multiply","A matrix is a rectangular table of numbers.","A matrix arranges numbers in m rows and n columns, so its order is m×n. Add matrices of the same order by adding matching entries. To multiply A (m×n) by B (n×p), each entry of the result is a row of A multiplied by a column of B, giving an m×p matrix.","A matrix is a table of numbers. Rows go across, columns go down. A 2×3 matrix has 2 rows and 3 columns.","[1 2; 3 4] + [5 6; 7 8] = [6 8; 10 12].","Order means rows × columns|Matrix multiplication is not commutative","Reading tables; adding and multiplying numbers."],
["Mathematics","Functions","What is a function?|function functions domain range input output","A function turns each input into exactly one output.","A function assigns every input in its domain exactly one output in its range, written f(x). For f(x) = 2x + 1, f(3) = 7. On a graph, a curve is a function if no vertical line crosses it twice.","Think of a machine: put a number in, get exactly one number out.","f(x) = 2x + 1. Input 3 → output 7.","One input gives one output|Domain means the allowed inputs","Replacing letters with numbers in expressions."],
["Physics","Motion","What is the difference between speed and velocity?|motion speed velocity acceleration","Motion is change of position over time.","Speed = distance ÷ time and has no direction. Velocity is speed in a given direction. Acceleration is the change in velocity per unit time. For constant acceleration, v = u + at.","Motion means moving. Speed says how fast. Velocity says how fast and which way.","A bus travels 120 km in 2 hours: speed = 60 km/h.","Speed has no direction|Velocity has direction","Division and units."],
["Physics","Force","What is Newton's second law?|force newton second law f=ma acceleration mass","A force is a push or a pull.","Newton's second law says F = ma: a bigger force gives a bigger acceleration, and a heavier object accelerates less for the same force. The first law says an object keeps its motion unless a net force acts. The third says every action has an equal and opposite reaction.","A force is a push or pull. Push harder and it speeds up more. Heavy things are harder to move.","A 2 kg trolley pushed with 10 N accelerates at 5 m/s².","F = ma|Force is measured in newtons","Motion and acceleration."],
["Physics","Work and Energy","What is work and energy?|work energy kinetic potential joule","Work moves things; energy makes work possible.","Work = force × distance moved. Energy is the ability to do work. Kinetic energy = ½mv² and gravitational potential energy = mgh. Energy changes form but the total stays the same.","Work happens when you push something and it moves. Energy is what lets you do it.","Lifting a 5 kg box 2 m: W = 5 × 10 × 2 = 100 J.","The unit is the joule|Energy is conserved","Force and distance."],
["Chemistry","Organic Chemistry","What is organic chemistry?|organic carbon hydrocarbon alkane alkene","Organic chemistry studies carbon compounds.","Carbon forms four bonds, so it builds chains and rings. Hydrocarbons contain only carbon and hydrogen. Alkanes have single bonds (CnH2n+2), alkenes a double bond, alkynes a triple bond.","It is the study of carbon-based molecules. Carbon can join four other atoms, so it makes long chains.","Methane is CH4; ethane is C2H6.","Carbon forms 4 bonds|Alkanes have only single bonds","Atoms and bonds."],
["Chemistry","IUPAC Nomenclature","What is IUPAC nomenclature?|iupac nomenclature naming alkane branch methyl","IUPAC gives every molecule one standard name.","Find the longest carbon chain (root: meth, eth, prop, but, pent). Number from the end nearest a branch. Name each branch (methyl, ethyl) with its number, then list branches alphabetically before the root.","IUPAC is a set of naming rules so all chemists use the same name. Count the longest chain, then name what hangs off it.","CH3-CH(CH3)-CH2-CH3 is 2-methylbutane.","Longest chain first|Give branches the lowest numbers","Organic basics: alkanes."],
["Chemistry","Chemical Bonding","What is chemical bonding?|bonding ionic covalent metallic electrons","Atoms bond to become more stable.","Ionic bonds transfer electrons (Na⁺ and Cl⁻). Covalent bonds share electron pairs (H2O). Metallic bonds share a sea of free electrons.","Atoms join by giving, sharing or pooling electrons. Giving is ionic. Sharing is covalent.","Table salt (NaCl) is ionic; water (H2O) is covalent.","Ionic means transfer|Covalent means share","Protons, neutrons and electrons."],
["Biology","Photosynthesis","Why does photosynthesis happen?|photosynthesis chlorophyll glucose oxygen plants light","Plants make food from light.","Chlorophyll in chloroplasts captures light energy. Carbon dioxide and water become glucose and oxygen: 6CO2 + 6H2O → C6H12O6 + 6O2. Plants do this because they need glucose for energy and growth, and it also supplies the oxygen we breathe.","Plants make their own food from sunlight, water and air, and give out oxygen.","Pondweed in sunlight releases oxygen bubbles.","Needs light, water and CO2|Makes glucose and oxygen","Plant cells."],
["Biology","Cells","What is a cell?|cell cells nucleus membrane mitochondria","Cells are the building blocks of life.","Animal cells have a nucleus, cytoplasm, membrane and mitochondria. Plant cells also have a cell wall, chloroplasts and a large vacuole.","A cell is the tiniest living building block. Everything alive is made of cells.","Onion skin under a microscope shows cell walls.","The nucleus controls the cell|Mitochondria release energy","Living and non-living things."],
["Biology","Genetics","What are genes and alleles?|genetics gene genes allele dominant recessive dna","Genes are instructions for how you grow.","Genes are sections of DNA. You inherit one allele of each gene from each parent. A dominant allele shows even with one copy; a recessive allele shows only with two.","Genes are instructions for how you look. You get half from each parent.","Brown eyes (B) are dominant over blue (b), so Bb gives brown eyes.","Alleles come in pairs|Dominant hides recessive","Cells and DNA."],
["Computer Science","Algorithms","What is an algorithm?|algorithm steps program problem","An algorithm is a list of clear steps to solve a problem.","An algorithm is a finite set of unambiguous steps. Good ones are correct and efficient. To find the largest number, compare each number with the biggest seen so far.","An algorithm is a recipe: step-by-step instructions that end with the job done.","Largest of 3, 9, 4: start with 3; 9 is bigger; 4 is not. Answer 9.","Steps must be clear|It must finish","Thinking in order."],
["Computer Science","Binary Numbers","What is binary?|binary bits base 2 zero one","Computers count with only 0 and 1.","Binary is base 2. Each place is a power of 2: 1, 2, 4, 8… To convert 1011 to decimal: 8 + 0 + 2 + 1 = 11.","Computers use switches that are off (0) or on (1). Binary is counting with only those two.","101 = 4 + 0 + 1 = 5.","Each place doubles|A bit is one 0 or 1","Place value."],
["Computer Science","Variables","What is a variable?|variable variables value store memory","A variable is a named box for a value.","A variable is a named place in memory that stores a value you can change. In Python: score = 10, then score = score + 5 makes it 15.","A variable is a labelled box that holds something.","score = 10; score = score + 5 → 15.","It has a name and a value|The value can change","Basic arithmetic."]];

const CM=[{id:"t1",t:"How do I find the inverse of a 3×3 matrix?",subj:"Mathematics",body:"I understand 2×2 but get lost with 3×3. Can someone explain the steps?",st:"solved",acc:"r1",name:"Sample student",sample:1,rs:[{id:"r1",type:"explanation",body:"Find the determinant first; if it is 0 there is no inverse. Then build the matrix of cofactors, transpose it (the adjugate), and divide every entry by the determinant.",name:"Sample student",h:["a","b"]},{id:"r2",type:"example",body:"For a diagonal matrix, just invert each diagonal entry: diag(2,4,5) has inverse diag(1/2,1/4,1/5). Use it to check your method.",lnk:"l1",name:"Sample student",h:["a"]}]},{id:"t2",t:"What is the difference between speed and velocity?",subj:"Physics",body:"My book uses both words. Are they the same?",st:"open",name:"Sample student",sample:1,rs:[{id:"r3",type:"explanation",body:"Speed only says how fast. Velocity also says the direction, so driving around a circle at steady speed still changes your velocity.",lnk:"l3",name:"Sample student",h:[]}]},{id:"t3",t:"How do I name a branched alkane?",subj:"Chemistry",body:"I never know which chain to count.",st:"open",name:"Sample student",sample:1,rs:[{id:"r4",type:"explanation",body:"Count the longest continuous carbon chain, even if it bends on the page. Number it from the end nearest a branch.",lnk:"l7",name:"Sample student",h:["a"]}]},{id:"t4",t:"Why do plant cells have a cell wall?",subj:"Biology",body:"Animal cells do not have one. What is it for?",st:"open",name:"Sample student",sample:1,rs:[]}];
function init(){if(L("init"))return;S("lessons",D.map((r,i)=>({id:"l"+i,subj:r[0],topic:r[1],q:r[2],intro:r[3],full:r[4],easy:r[5],ex:r[6],pts:r[7].split("|"),pre:r[8]})));S("resources",RD.map((r,i)=>({id:"r"+i,title:r[0],subj:r[1],d:r[2],diff:r[3],fmt:r[4],min:r[5],tags:r[6].split(","),cats:r[7].split(","),les:"l"+r[8]})));S("questions",D.map((r,i)=>({id:"q"+i,q:r[2].split("|")[0],les:"l"+i})));S("community",CM);["savedLessons","savedResources","recent"].forEach(k=>S(k,[]));S("progress",{});S("acc",{size:1,read:0,contrast:0,space:0,motion:0,fmt:0});S("dev","d"+Math.random().toString(36).slice(2));S("demo",0);S("init",1)}
